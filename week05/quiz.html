<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <!-- Q1 -->
            <div class="form-item">
                <label for="q1"><strong>1.</strong> What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <!-- Q2 -->
            <div class="form-item">
                <label for="q2"><strong>2.</strong> How are id and class attributes selected in
                    CSS?</label>
                <textarea id="q2" name="q2" rows="5"></textarea>
            </div>

            <!-- Q3 -->
            <div class="form-item">
                <label for="q3"><strong>3.</strong> Which of the following is a valid CSS
                    comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="1">/* comment */</option>
                    <option value="2">&lt;!-- comment --&gt;</option>
                    <option value="3">// comment</option>
                </select>
            </div>

            <!-- Q4 -->
            <div class="form-item">
                <label for="q4"><strong>4.</strong> What is the bottom margin given this
                    declaration?</label>
                <div class="code-snippet">
                    margin: 10px 5px 15px;
                </div>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
